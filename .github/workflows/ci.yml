name: Pico 2 cross-build and ESKF host validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests, finite-difference audits and replay
        run: ./tools/run_bundle_a_checks.sh
      - name: Bundle B motion/noise simulations and estimator comparison
        run: ./tools/run_bundle_b_checks.sh
      - name: Sanitized regression tests
        env:
          BUNDLE_A_SANITIZERS: '1'
        run: |
          ./tools/run_bundle_a_checks.sh
          BUNDLE_B_SANITIZERS=1 ./tools/run_bundle_b_checks.sh
  pico2-cross-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: firmware
      - name: Fetch pinned Pico SDK 2.2.0 including USB dependencies
        uses: actions/checkout@v4
        with:
          repository: raspberrypi/pico-sdk
          ref: 2.2.0
          path: pico-sdk
          submodules: recursive
      - name: Install ARM compiler and native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi cmake ninja-build python3
      - name: Configure Pico 2 Cortex-M33 firmware
        working-directory: firmware
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPICO_BOARD=pico2 -DPICO_PLATFORM=rp2350
      - name: Cross-compile and inspect size
        working-directory: firmware
        run: |
          cmake --build build --parallel 2
          arm-none-eabi-size build/rp2350_lsm6ds3_fusion.elf
          test -s build/rp2350_lsm6ds3_fusion.uf2
          sha256sum build/rp2350_lsm6ds3_fusion.uf2
      - uses: actions/upload-artifact@v4
        with:
          name: rp2350-pico2-firmware
          path: |
            firmware/build/rp2350_lsm6ds3_fusion.uf2
            firmware/build/rp2350_lsm6ds3_fusion.elf
            firmware/build/rp2350_lsm6ds3_fusion.bin
